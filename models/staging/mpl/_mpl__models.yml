models:
  - name: stg_mpl__bikes
    description: >
      One day's MPL bike extract from the raw_mpl_bikes source (selected by `var('load_day')`).
      One row per product. Columns are renamed here, once, for everything downstream; `load_day`
      is dropped so it can't trigger a new snapshot version on every load. The contract fails the
      build if the source's shape changes, before bad data reaches the snapshot.
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        description: '{{ doc("mpl_product_id") }}'
        data_type: number(38,0)
        data_tests:
          - unique
          - not_null
      - name: sku
        description: '{{ doc("sku") }}'
        data_type: varchar
      - name: model_name
        description: '{{ doc("model_name") }}'
        data_type: varchar
      - name: model_year
        description: '{{ doc("model_year") }}'
        data_type: number(38,0)
      - name: product_family
        description: '{{ doc("product_family") }}'
        data_type: varchar
      - name: msrp_usd
        description: '{{ doc("msrp_usd") }}'
        data_type: number(38,2)
      - name: launch_date
        description: '{{ doc("launch_date") }}'
        data_type: date
      - name: display_order
        description: '{{ doc("display_order") }}'
        data_type: number(38,0)
      - name: updated_by_user_id
        description: '{{ doc("updated_by_user_id") }}'
        data_type: number(38,0)
      - name: last_updated_at
        description: '{{ doc("last_updated_at") }}'
        data_type: timestamp_ntz

  - name: stg_mpl__equipment
    description: >
      One day's MPL equipment extract (selected by `var('load_day')`). One row per product.
    columns:
      - name: product_id
        description: '{{ doc("mpl_product_id") }}'
        data_tests:
          - unique
          - not_null
      - name: sku
        description: '{{ doc("sku") }}'
      - name: equipment_name
        description: '{{ doc("equipment_name") }}'
      - name: category
        description: '{{ doc("equipment_category") }}'
      - name: msrp_usd
        description: '{{ doc("msrp_usd") }}'
      - name: deleted
        description: '{{ doc("deleted_flag") }}'
      - name: update_user
        description: '{{ doc("update_user") }}'
      - name: last_update
        description: '{{ doc("last_update") }}'


  - name: stg_mpl__bike_fobs
    description: >
      One day's MPL bike FOB cost extract (selected by `var('load_day')`). One row per FOB.
    columns:
      - name: fob_id
        description: '{{ doc("fob_id") }}'
        data_tests:
          - unique
          - not_null
      - name: sku
        description: '{{ doc("sku") }}'
      - name: fob_port
        description: '{{ doc("fob_port") }}'
      - name: currency
        description: '{{ doc("currency") }}'
      - name: fob_cost
        description: '{{ doc("fob_cost") }}'
      - name: effective_date
        description: '{{ doc("effective_date") }}'
