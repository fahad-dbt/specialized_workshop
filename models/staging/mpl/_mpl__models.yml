models:
  - name: stg_mpl__bikes
    description: >
      One day's MPL bike extract (selected by `var('load_day')`). One row per product.
      `load_day` is dropped so it can't trigger a new snapshot version on every load.
    columns:
      - name: product_id
        description: '{{ doc("mpl_product_id") }}'
        data_tests:
          - unique
          - not_null
      - name: sku
        description: '{{ doc("sku") }}'
      - name: model_name
        description: '{{ doc("model_name") }}'
      - name: model_year
        description: '{{ doc("model_year") }}'
      - name: product_family
        description: '{{ doc("product_family") }}'
      - name: msrp
        description: '{{ doc("msrp") }}'
      - name: launch_date
        description: '{{ doc("launch_date") }}'
      - name: display_order
        description: '{{ doc("display_order") }}'
      - name: update_user
        description: '{{ doc("update_user") }}'
      - name: last_update
        description: '{{ doc("last_update") }}'

  - name: stg_mpl__equipment
    description: >
      One day's MPL equipment extract (selected by `var('load_day')`). One row per product.
    columns:
      - name: product_id
        description: '{{ doc("mpl_product_id") }}'
        data_tests:
          - unique
          - not_null
      - name: sku
        description: '{{ doc("sku") }}'
      - name: equipment_name
        description: '{{ doc("equipment_name") }}'
      - name: category
        description: '{{ doc("equipment_category") }}'
      - name: msrp
        description: '{{ doc("msrp") }}'
      - name: deleted
        description: '{{ doc("deleted_flag") }}'
      - name: update_user
        description: '{{ doc("update_user") }}'
      - name: last_update
        description: '{{ doc("last_update") }}'

  - name: stg_mpl__bike_fobs
    description: >
      One day's MPL bike FOB cost extract (selected by `var('load_day')`). One row per FOB.
    columns:
      - name: fob_id
        description: '{{ doc("fob_id") }}'
        data_tests:
          - unique
          - not_null
      - name: sku
        description: '{{ doc("sku") }}'
      - name: fob_port
        description: '{{ doc("fob_port") }}'
      - name: currency
        description: '{{ doc("currency") }}'
      - name: fob_cost
        description: '{{ doc("fob_cost") }}'
      - name: effective_date
        description: '{{ doc("effective_date") }}'
