models:
  - name: fct_product_changes
    description: >
      The MDM product changelog. Replaces MDM_CHANGELOG_TBL. One row per NEW / DELETE record
      (column_name = 'ALL') or per changed column (UPDATE) across every tracked table.
      Incremental merge on a deterministic change_key, so it can be rerun or rebuilt safely.
      Column contract enforced so downstream consumers (Tableau) can't be broken by a silent change.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: change_date
    columns:
      - name: change_key
        description: '{{ doc("changelog__change_key") }}'
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: product_change
      - name: table_name
        description: '{{ doc("changelog__table_name") }}'
        data_type: varchar
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: table_pk
        description: '{{ doc("changelog__table_pk") }}'
        data_type: varchar
      - name: table_pk_value
        description: '{{ doc("changelog__table_pk_value") }}'
        data_type: varchar
        data_tests:
          - not_null
      - name: product_id
        description: '{{ doc("changelog__product_id") }}'
        data_type: varchar
      - name: item_id
        description: '{{ doc("changelog__item_id") }}'
        data_type: varchar
      - name: inventory_item_id
        description: '{{ doc("changelog__inventory_item_id") }}'
        data_type: varchar
      - name: fob_id
        description: '{{ doc("changelog__fob_id") }}'
        data_type: varchar
      - name: sku
        description: '{{ doc("changelog__sku") }}'
        data_type: varchar
        dimension:
          type: categorical
      - name: column_name
        description: '{{ doc("changelog__column_name") }}'
        data_type: varchar
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: old_value
        description: '{{ doc("changelog__old_value") }}'
        data_type: varchar
      - name: new_value
        description: '{{ doc("changelog__new_value") }}'
        data_type: varchar
      - name: change
        description: '{{ doc("changelog__change") }}'
        data_type: varchar
      - name: change_percent
        description: '{{ doc("changelog__change_percent") }}'
        data_type: number(38, 4)
      - name: record_type
        description: '{{ doc("changelog__record_type") }}'
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NEW', 'UPDATE', 'DELETE']
        dimension:
          type: categorical
      - name: change_date
        description: '{{ doc("changelog__change_date") }}'
        data_type: timestamp_ntz
        data_tests:
          - not_null
        granularity: day
        dimension:
          type: time
      - name: system_of_change
        description: '{{ doc("changelog__system_of_change") }}'
        data_type: varchar
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: snapshot_valid_from
        description: '{{ doc("changelog__snapshot_valid_from") }}'
        data_type: timestamp_ntz
      - name: load_date
        description: '{{ doc("changelog__load_date") }}'
        data_type: timestamp_ntz

    metrics:
      - name: product_changes
        label: Product Changes
        description: Count of changelog rows (record-level NEW / DELETE plus column-level UPDATE).
        type: simple
        agg: count
        expr: change_key

      - name: new_products
        label: New Products
        description: Count of records that first appeared after the initial load.
        type: simple
        agg: count
        expr: change_key
        filter: |
          {{ Dimension('product_change__record_type') }} = 'NEW'

      - name: deleted_products
        label: Deleted Products
        description: Count of records removed from the source, or soft-deleted (DELETED set to Y).
        type: simple
        agg: count
        expr: change_key
        filter: |
          {{ Dimension('product_change__record_type') }} = 'DELETE'

      - name: avg_msrp_change_pct
        label: Avg MSRP Change %
        description: Average percentage change of MSRP across MSRP updates.
        type: simple
        agg: average
        expr: change_percent
        filter: |
          {{ Dimension('product_change__column_name') }} = 'MSRP'

  - name: time_spine_daily
    description: >
      One row per calendar day from 2024-01-01 to 2029-12-31, built with `dbt.date_spine`.
      Required by the Semantic Layer for time-based metric queries.
    config:
      materialized: table
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar day. The standard daily grain for the Semantic Layer.
        granularity: day
